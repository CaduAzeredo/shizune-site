# O portão, na integração contínua.
#
# Ele roda o mesmo `bun run portao` da máquina — nada de uma régua para o
# desenvolvimento e outra para o CI. O que muda é só o navegador: aqui não há
# Brave, então o `e2e` cai no Chrome do runner. Os dois são Chromium.
#
# O que o CI NÃO roda, e é de propósito:
#
# - `node scripts/ficha.mjs` — ela troca a ficha da release que o site lê. A
#   ficha entra por PR, com o diff à vista: pela cadeia (um workflow agendado
#   que confere a ficha e abre o PR em `preview/*`) ou à mão. Trocá-la num
#   push faria os números da página mudarem sem ninguém ver o diff; o `portao`
#   confere que a página bate com o arquivo commitado.
# - `bun run arte` — mesma razão: arte gerada em CI entra sem revisão visual.
name: portão

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: o portão inteiro
        run: bun run portao
